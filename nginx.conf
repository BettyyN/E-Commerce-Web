server {
    listen 80;
    server_name _;

    # ✅ ADD THIS LINE: Allow uploads up to 50 Megabytes
    client_max_body_size 5M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Static assets: MUST return 404 if missing, never fall back ───
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Favicon and root-level static files ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Never cache index.html (so new deploys are picked up) ───
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── API proxy to the gateway ───
    location /api/ {
        proxy_pass http://svc-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "keep-alive";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ ADD THIS: Stream the upload directly to .NET instead of buffering in Nginx
        proxy_request_buffering off;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ─── SPA fallback: only for routes, NOT for assets ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health { access_log off; return 200 "ok\n"; }
}